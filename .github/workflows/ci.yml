name: CI

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: |
            package-lock.json
            server/package-lock.json
            client/package-lock.json

      # The root postinstall runs "npm install" in every sub-project (including
      # Electron). Skip it here; each sub-project gets its own clean "npm ci".
      - name: Install root
        run: npm ci --ignore-scripts

      - name: Install server
        working-directory: server
        run: npm ci

      - name: Install client
        working-directory: client
        run: npm ci

      - name: Build client
        working-directory: client
        run: npm run build

      - name: Syntax check server
        working-directory: server
        run: |
          for f in src/*.js; do
            echo "node --check $f"
            node --check "$f"
          done

      - name: Server tests
        working-directory: server
        run: npm test --if-present

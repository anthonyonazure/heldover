name: Release

on:
  push:
    tags: ["v*"]

# Nothing gets write access unless a job asks for it below. Third-party actions
# are pinned to exact commits (the version tag is in the comment), so a moved
# or hijacked tag cannot change what runs with publishing rights.
permissions:
  contents: read

jobs:
  docker:
    name: Docker image (amd64 + arm64)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Lowercase image name
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image tags and labels
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest
          # The image also carries Debian's ffmpeg, so "MIT" alone (taken from
          # the repository) would be wrong for the image as a whole.
          labels: |
            org.opencontainers.image.licenses=MIT AND GPL-2.0-or-later

      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Builds run with read-only access: every package's install scripts run here,
  # and none of them should be able to publish anything.
  desktop:
    name: Desktop app (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            script: build:mac
          - os: windows-latest
            script: build:win
          - os: ubuntu-latest
            script: build:linux
    env:
      # Unsigned builds: stop electron-builder looking for a signing identity.
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: lts/*

      # Root postinstall would "npm install" every sub-project; use npm ci per
      # project instead so the lockfiles are honoured.
      - name: Install root
        run: npm ci --ignore-scripts

      - name: Install server
        working-directory: server
        run: npm ci --omit=dev

      - name: Install client
        working-directory: client
        run: npm ci

      - name: Install electron
        working-directory: electron
        run: npm ci

      # The packaged app runs the server inside Electron's own Node, so the
      # server's native module (better-sqlite3) must be rebuilt for Electron.
      - name: Rebuild server native modules for Electron
        working-directory: electron
        shell: bash
        run: npm run rebuild:server

      - name: Build client
        run: npm run build

      - name: Build desktop app
        working-directory: electron
        run: npm run ${{ matrix.script }} -- --publish never

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: desktop-${{ matrix.os }}
          path: |
            electron/dist-electron/*.dmg
            electron/dist-electron/*.exe
            electron/dist-electron/*.AppImage
          if-no-files-found: error

  # The only job that can write to the release, and it runs no project code.
  publish:
    name: Attach installers to the release
    needs: desktop
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: installers
          merge-multiple: true

      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: installers/*
          fail_on_unmatched_files: true

version: 2
# Security updates are always on for every ecosystem GitHub understands; these
# entries add routine version bumps so the repo does not drift years behind and
# turn every future upgrade into a migration.
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule: { interval: "daily" }
    open-pull-requests-limit: 5
    labels: ["dependencies", "gauntlet"]
  # Each folder has its own package.json and lockfile, so each needs its own
  # entry: the root one alone never looked at what the app actually ships.
  - package-ecosystem: "npm"
    directory: "/"
    schedule: { interval: "daily" }
    open-pull-requests-limit: 5
    labels: ["dependencies", "gauntlet"]
  - package-ecosystem: "npm"
    directory: "/server"
    schedule: { interval: "daily" }
    open-pull-requests-limit: 5
    labels: ["dependencies", "gauntlet"]
  - package-ecosystem: "npm"
    directory: "/client"
    schedule: { interval: "daily" }
    open-pull-requests-limit: 5
    labels: ["dependencies", "gauntlet"]
  - package-ecosystem: "npm"
    directory: "/electron"
    schedule: { interval: "daily" }
    open-pull-requests-limit: 5
    labels: ["dependencies", "gauntlet"]
